version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: erp_agricola_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: erp_agricola
      MYSQL_USER: agricola_user
      MYSQL_PASSWORD: agricola_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql_data:
